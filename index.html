
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點餐系統 Demo（HTML 版）</title>
  <style>
    :root {
      --primary: #2f7cf6;
      --border: #e7e7e7;
      --bg: #f7f9fc;
      --text: #222;
      --muted: #666;
      --success: #13a10e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, "Hiragino Sans", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background-color: #fff;
    }
    header {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 5;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }
    main {
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* 菜單列表 */
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
    }
    .price {
      font-size: 14px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }
    .btn {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-outline {
      background: #fff;
      color: var(--text);
    }
    .qty {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
    }

    /* 底部工具列 */
    .footer {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 1px solid var(--border);
      background: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 5;
    }
    .total {
      font-size: 18px;
      font-weight: 800;
    }

    /* 結帳視窗（Modal） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      width: min(960px, 96vw);
      height: min(720px, 90vh);
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close {
      border: none;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
    }

    /* 上下兩個視窗 */
    .checkout-split {
      display: grid;
      grid-template-rows: 60% 40%;
      height: 100%;
    }
    .top-pane {
      padding: 12px 16px;
      overflow: auto;
    }
    .bottom-pane {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow: auto;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .checkout-list {
      display: grid;
      gap: 8px;
    }
    .checkout-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
    }
    .checkout-total {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
      font-weight: 800;
      font-size: 18px;
    }
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .einvoice-img {
      width: min(520px, 100%);
      height: auto;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      color: #fff;
      background: var(--success);
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* 手機優化 */
    @media (max-width: 480px) {
      .checkout-split {
        grid-template-rows: 55% 45%;
      }
      .einvoice-img { max-height: 180px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>菜單</h1>
  </header>

  <main>
    <div id="menu" class="menu"></div>
  </main>

  <footer class="footer">
    <div>
      <span class="total">總計：$ <span id="total">0</span></span>
      <span class="tag">含未稅</span>
    </div>
    <button class="btn btn-primary" id="checkoutBtn">前往結帳</button>
  </footer>

  <!-- 結帳視窗（第二層） -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
      <div class="modal-header">
        <div class="modal-title" id="checkoutTitle">結帳</div>
        <button class="modal-close" id="closeModal" aria-label="關閉">✕</button>
      </div>

      <div class="checkout-split">
        <!-- 上層：點餐內容與總價 -->
        <div class="top-pane">
          <div class="section-title">點餐內容</div>
          <div id="checkoutList" class="checkout-list"></div>
          <div class="checkout-total">
            <span>總計：</span>
            <span>$ <span id="checkoutTotal">0</span></span>
          </div>
          <div class="action-row">
            <button class="btn btn-outline" id="clearBtn">清空</button>
            <button class="btn btn-primary" id="submitBtn">送出訂單</button>
          </div>
        </div>

       


<!-- 下層：發票載具圖片 -->
<div class="bottom-pane">
   <!-- 圖片：符合視窗、置中 -->
   <img src="https://github.com/rcc0728/rcc0728/blob/main/einvoice_carrier.png" alt="發票載具">
    
  </div>
</div>

<script>
  function handleImageError() {
    const img = document.getElementById('carrierImg');
    const hint = document.getElementById('imgHint');
    img.style.display = 'none';
    hint.style.display = 'block';
  }
</script>

<style>
  /* 讓此區塊滿版且置中 */
  .bottom-pane {
    display: flex;
    flex-direction: column;
    align-items: center;           /* 水平置中 */
    justify-content: center;       /* 垂直置中 */
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }

  .section-title {
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* 圖片在視窗內自動縮放（不裁切） */
  .carrier-img {
    max-width: 60%;
    height: auto;
    width: auto;
    object-fit: contain;             /* 保持完整顯示、無裁切 */
    display: block;
    margin: 0 auto;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  .hint {
    color: #b00020;
    background: #fff3f3;
    padding: 10px 12px;
    border: 1px solid #ffd6d6;
    border-radius: 6px;
    font-size: 14px;
    margin-top: 12px;
    max-width: 640px;
  }

  /* iOS 安全區優化（可選） */
  @supports(padding: max(0px)) {
    .bottom-pane {
      padding: max(16px, env(safe-area-inset-top))
               max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom))
               max(16px, env(safe-area-inset-left));
    }
  }
</style>

  <script>
    // ---- 模擬菜單資料（可按需求更改或改成後端載入）----
    const MENU = [
      { id: '1', name: '帶踝雞腿排', price: 85 },
      { id: '2', name: '蔬菜沙拉', price: 60 },
      { id: '3', name: '起士蛋丹麥吐司', price: 60 },
      { id: '4', name: '雞塊', price: 35 },
      { id: '5', name: '卡拉雞腿堡加蛋', price: 75 },
      { id: '6', name: '紐奧良辣雞加蛋', price: 60 },
      { id: '7', name: '鮮蛋法式燒餅', price: 45 },
      { id: '8', name: '兒童B餐', price: 70 },
      { id: '9', name: 'F.香煎嫩雞腿排/巧克力厚片', price: 149 },
      { id: '10', name: '德式香腸', price: 35 },
      { id: '11', name: '龍蝦沙拉軟法', price: 55 },
      { id: '12', name: '紅茶/熱/M/半糖', price: 20 },
      { id: '13', name: '皇家奶茶/熱/M/半糖', price: 30 },
      { id: '14', name: '可可亞/微冰/半糖/M', price: 25 },
      { id: '15', name: '可可亞/熱/半糖/M', price: 25 },
      { id: '16', name: '玉米濃湯/大/', price: 40 },
      { id: '17', name: '青菜', price: 40 },
      { id: '18', name: '青菜', price: 40 },
      { id: '19', name: '青菜', price: 40 },
      { id: '20', name: '青菜', price: 40 },
    ];

    // ---- 購物車狀態：{ id: { item, qty } } ----
    const cart = {};
    const menuEl = document.getElementById('menu');
    const totalEl = document.getElementById('total');
    const checkoutBtn = document.getElementById('checkoutBtn');

    const backdrop = document.getElementById('modalBackdrop');
    const closeModal = document.getElementById('closeModal');
    const checkoutListEl = document.getElementById('checkoutList');
    const checkoutTotalEl = document.getElementById('checkoutTotal');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');

    function renderMenu() {
      menuEl.innerHTML = '';
      MENU.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = item.name;

        const price = document.createElement('div');
        price.className = 'price';
        price.textContent = `$ ${item.price}`;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const btnMinus = document.createElement('button');
        btnMinus.className = 'btn btn-outline';
        btnMinus.textContent = '－';
        btnMinus.onclick = () => removeFromCart(item.id);

        const qty = document.createElement('div');
        qty.className = 'qty';
        qty.id = `qty-${item.id}`;
        qty.textContent = cart[item.id]?.qty || 0;

        const btnPlus = document.createElement('button');
        btnPlus.className = 'btn btn-primary';
        btnPlus.textContent = '＋';
        btnPlus.onclick = () => addToCart(item);

        actions.append(btnMinus, qty, btnPlus);
        card.append(title, price, actions);
        menuEl.appendChild(card);
      });
      updateTotal();
    }

    function addToCart(item) {
      const existing = cart[item.id];
      const qty = existing ? existing.qty + 1 : 1;
      cart[item.id] = { item, qty };
      document.getElementById(`qty-${item.id}`).textContent = qty;
      updateTotal();
    }

    function removeFromCart(id) {
      const existing = cart[id];
      if (!existing) return;
      const newQty = existing.qty - 1;
      if (newQty <= 0) {
        delete cart[id];
      } else {
        cart[id].qty = newQty;
      }
      const qtyEl = document.getElementById(`qty-${id}`);
      if (qtyEl) qtyEl.textContent = cart[id]?.qty || 0;
      updateTotal();
    }

    function updateTotal() {
      const total = Object.values(cart).reduce((sum, { item, qty }) => sum + item.price * qty, 0);
      totalEl.textContent = total;
      checkoutTotalEl.textContent = total;
    }

    function openModal() {
      renderCheckout();
      backdrop.style.display = 'flex';
      backdrop.setAttribute('aria-hidden', 'false');
      // 鍵盤 ESC 關閉
      document.addEventListener('keydown', escCloseOnce);
    }

    function closeModalFn() {
      backdrop.style.display = 'none';
      backdrop.setAttribute('aria-hidden', 'true');
      document.removeEventListener('keydown', escCloseOnce);
    }

    function escCloseOnce(e) {
      if (e.key === 'Escape') closeModalFn();
    }

    function renderCheckout() {
      checkoutListEl.innerHTML = '';
      const entries = Object.values(cart);
      if (entries.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'hint';
        empty.textContent = '目前尚未點餐';
        checkoutListEl.appendChild(empty);
        checkoutTotalEl.textContent = '0';
        return;
      }
      entries.forEach(({ item, qty }) => {
        const row = document.createElement('div');
        row.className = 'checkout-row';

        const left = document.createElement('div');
        left.textContent = `${item.name} × ${qty}`;

        const right = document.createElement('div');
        right.textContent = `$ ${item.price * qty}`;

        row.append(left, right);
        checkoutListEl.appendChild(row);
      });
      updateTotal();
    }

    function clearCart() {
      for (const k of Object.keys(cart)) delete cart[k];
      renderMenu();
      renderCheckout();
    }

    // ---- 綁定事件 ----
    checkoutBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeModalFn);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModalFn(); // 點背景關閉
    });
    clearBtn.addEventListener('click', clearCart);
    submitBtn.addEventListener('click', () => {
      const total = checkoutTotalEl.textContent;
      if (Number(total) === 0) {
        alert('尚未選擇餐點');
        return;
      }
      // 這裡可以改成串接你的付款或後端 API
      alert('已送出訂單！總計 $ ' + total);
      clearCart();
      closeModalFn();
    });

    // 初始化
    renderMenu();
  </script>
</body>
</html>
